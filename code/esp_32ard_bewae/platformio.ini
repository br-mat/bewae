; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
lib_deps =
	adafruit/Adafruit BME280 Library@^2.2.2
    bblanchon/ArduinoJson@^6.19.4
	tobiasschuerg/ESP8266 Influxdb@^3.13.1
	paulstoffregen/OneWire@^2.3.7
	gbertaz/NonBlockingDallas@^1.0.3
	intrbiz/Crypto@^1.0.0

; Offline test build — no WiFi, no RTC, hardcoded time, short cooldowns
; Upload: pio run -e esp32doit-devkit-v1-offline -t upload
; Filesystem: pio run -e esp32doit-devkit-v1-offline -t uploadfs
[env:esp32doit-devkit-v1-offline]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
build_flags =
	-D OFFLINE_TEST
	-D DRIVER_COOLDOWN=5000UL
	-D SOLENOID_COOLDOWN=5000UL
lib_deps =
	adafruit/Adafruit BME280 Library@^2.2.2
    bblanchon/ArduinoJson@^6.19.4
	tobiasschuerg/ESP8266 Influxdb@^3.13.1
	paulstoffregen/OneWire@^2.3.7
	gbertaz/NonBlockingDallas@^1.0.3
	intrbiz/Crypto@^1.0.0
